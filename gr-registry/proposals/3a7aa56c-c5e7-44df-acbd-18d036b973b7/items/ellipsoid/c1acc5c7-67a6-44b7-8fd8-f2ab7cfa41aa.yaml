  remarks: >-
    Sir David Gill adopted the values of Clarke's 1880 semi-major and semi-minor
    axes in British feet. However, the only reliable metre-foot ratio at the
    time was Clarke's 1866 relation which connected the British foot with the
    "legal" metre at 39.37043196 inches per metre, not the international metre.
    The result was the creation of a fictitious unit of measure, referred to as
    the South African Geodetic (S.A.G.) foot. The resultant ellipsoid is
    referred to as the Modified Clarke 1880 ellipsoid. This ellipsoid's
    parameters are one of various modifications to the original definition.
    These parameters are applicable to the Cape and Arc 1950 Datums, but not the
    Arc 1960 Datum, which references the Royal Geographical Society (RGS)
    ellipsoid (ISOGR 1336).
