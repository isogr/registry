  identifier: -18
  name: Time-Specific Position Vector Transformation (3D Cartesian to 2D Geographic)
  aliases: []
  informationSources: []
  remarks: >-
    ORIGINAL VERSION

    Three step transformation from 3D geocentric ITRF91 to 2D geographic Hart94.
    First step involves a time-specific position vector transformation of 3D
    Cartesian coordinates from ITRF91 to Hart94 (ISOGR:1337).  The second step
    involves conversion of the Hart94 3D Cartesian coordinates to Hart94 3D
    geographic coordinates (ISOGR:78), and the third step involves convering
    Hart94 3D geographic coordinats to Hart 2D geographic coordinates
    (ISOGR:86). This method uses clockwise rotations and is similar to the
    Coordinate Frame Transformation methods that uses counter-clockwise
    rotations. The Position Vector (clockwise) convention is used by the
    International Earth Rotation and Reference Systems Service (IERS) and
    International GNSS Service (IGS).


    MC  REVISION 2026-08-28/31

    Three step transformation from 3D geocentric to 2D geographic. The first
    step is a time-specific position vector transformation of 3D Cartesian
    coordinates (ISOGR:1337).  The second step is a conversion of the  3D
    Cartesian coordinates to 3D geographic coordinates (ISOGR:78). The third and
    final step is a conversion of 3D geographic coordinates to 2D geographic
    coordinates (ISOGR:86). This method uses clockwise rotations and is similar
    to the Coordinate Frame Transformation methods that uses counter-clockwise
    rotations. The Position Vector (clockwise) convention is used by the
    International Earth Rotation and Reference Systems Service (IERS) and
    International GNSS Service (IGS).
