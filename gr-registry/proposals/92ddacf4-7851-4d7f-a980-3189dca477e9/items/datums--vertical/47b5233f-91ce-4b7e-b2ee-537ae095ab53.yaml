        Africa
  remarks: >-
    Geodetic levelling commenced in 1904, however, a period of inactivity
    followed after which levelling resumed in 1925. SALLD is comprised of 43
    Primary Levelling routes, 15 Secondary Levelling routes and 14 Tertiary
    Levelling circuits. The levelling network has not been computed using actual
    gravity measurements. Instead, interpolated gravity values were used. The
    network has not been adjusted.
  scope: Spatial referencing
  originDescription: >-
    The reference surface is defined by mean sea level as determined by tidal
    observations at Cape Town harbour in 1900 and 1907. The reference surface is
    modelled by the SAGEOID2010 hybrid geoid model, referenced to the ITRF2005
    and the WGS 84 reference ellipsoid. The heights are orthometric.
