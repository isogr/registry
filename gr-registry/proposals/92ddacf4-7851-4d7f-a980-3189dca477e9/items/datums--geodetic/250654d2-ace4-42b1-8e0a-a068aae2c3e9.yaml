  remarks: >-
    Replaces the Cape datum in South Africa. A GPS network was observed on 205
    stations and after adjustment resulted in zero-order accuracy on these
    control points. The balance of the Hart94 control network of approximately
    30,000 stations was subsequently adjusted with terrestrial measurements
    (angles and distances) using the 205 control points as fixed constraints.
  scope: Spatial referencing
  originDescription: >-
    Static reference frame aligned with a horizontal accuracy of approximately 5
    cm to ITRF91 at epoch 1994.0 through a network of 205 GPS observed
    zero-order control points.
