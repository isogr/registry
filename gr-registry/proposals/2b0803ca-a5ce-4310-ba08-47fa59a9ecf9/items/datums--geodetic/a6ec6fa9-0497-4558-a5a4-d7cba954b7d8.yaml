  remarks: >-
    Replaces PSAD56 in Guyana. GGD2015 was derived from SIRGAS-CON weekly
    solution SIR23P2268 in ITRF2020 at epoch 2023.489 and transformed to
    SIRGAS-CON SIR17P01 at epoch 2015.0 using a Helmert transformation derived
    from 12 SIRGAS stations on the stable part of the South American tectonic
    plate.
  scope: Spatial referencing
  originDescription: >-
    GGD2015 is a static reference frame realized by a fiducial network of 11
    CORS stations nominally aligned to the dynamic SIRGAS-CON SIR17P01 reference
    frame at epoch 2015.0, and nominally fixed to the South American tectonic
    plate. GGD2015  is considered equivalent to ITRF2014 at epoch 2015.0.
